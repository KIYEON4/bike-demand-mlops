name: Cloud MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      simulate_error:
        description: "의도적 오류 재현 여부 (none | wrong_model_path)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - wrong_model_path

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV_NAME: github-actions-ubuntu-cloud

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ensure dataset is present
        run: |
          python scripts/download_data.py

      - name: 5. Run end-to-end MLOps pipeline (validate -> train -> evaluate -> smoke_test)
        run: |
          if [ "${{ inputs.simulate_error }}" = "wrong_model_path" ]; then
            MODEL_PATH="models/non_existent_model.joblib" python scripts/run_pipeline.py --env-name "$ENV_NAME" --skip-train
          else
            python scripts/run_pipeline.py --env-name "$ENV_NAME"
          fi

      - name: 6. Run unit & API integration tests
        run: |
          pytest -v

      - name: 7. Upload execution artifacts (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-cloud-results-${{ github.run_id }}
          path: |
            results/
            models/model_metadata.json
          retention-days: 14
